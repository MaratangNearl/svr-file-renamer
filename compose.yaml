services:
  adname:
    image: ${IMAGE:-ghcr.io/maratangnearl/svr-file-renamer:latest}
    container_name: svr-file-renamer
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-18080}:8080"
    environment:
      APP_DATA: /config
      MEDIA_ROOT: /media
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TZ: "${TZ:-Asia/Seoul}"
    volumes:
      - type: bind
        source: ${MEDIA_PATH:?Set MEDIA_PATH in .env}
        target: /media
        bind:
          create_host_path: false
      - type: bind
        source: ${CONFIG_PATH:-./data}
        target: /config
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
